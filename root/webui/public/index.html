<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Mirror - Puls Analyse</title>
    
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    
    <style>
        :root {
            --main-color: #ffffff;
            --accent-color: #ff3b30;
            --bg-color: #000000;
            --success-color: #34c759;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #pulse-container {
            text-align: center;
            margin-bottom: 60px;
        }

        #heart {
            font-size: 120px;
            color: var(--accent-color);
            display: inline-block;
            transition: transform 0.1s ease-out;
        }

        #bpm-value {
            font-size: 160px;
            font-weight: bold;
            display: block;
            margin-top: -10px;
        }

        .unit {
            font-size: 30px;
            opacity: 0.5;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 25px;
        }

        button {
            padding: 18px 35px;
            font-size: 18px;
            background: transparent;
            color: white;
            border: 2px solid white;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        button:active { transform: scale(0.95); }
        
        .btn-start:hover { 
            background: var(--success-color); 
            border-color: var(--success-color); 
        }
        
        .btn-stop:hover { 
            background: var(--accent-color); 
            border-color: var(--accent-color); 
        }

        #status {
            margin-top: 40px;
            font-size: 13px;
            color: #666;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="pulse-container">
        <div id="heart">❤</div>
        <span id="bpm-value">--</span>
        <span class="unit">BPM</span>
    </div>

    <div class="controls">
        <button class="btn-start" onclick="controlSystem('startHeadMovement')">Start (HeadMovement)</button>
        <button class="btn-start" onclick="controlSystem('startEulerianMotion')">Start (EulerianMotion)</button>
        <button class="btn-start" onclick="controlSystem('startLegacyMeasurement')">Start (LegacyMeasurement)</button>
        <button class="btn-stop" onclick="controlSystem('stop')">Stop</button>
    </div>

    <div id="status">Initialize...</div>

    <script>
        const statusEl = document.getElementById('status');
        const bpmEl = document.getElementById('bpm-value');
        const heartEl = document.getElementById('heart');

        var ros = new ROSLIB.Ros();

        function connectROS() {
            const rosUrl = 'ws://' + window.location.hostname + ':9090';
            console.log("Connect to: " + rosUrl);
            ros.connect(rosUrl);
        }

        ros.on('connection', () => {
            statusEl.innerText = 'STATUS: CONNECTED';
            statusEl.style.color = '#34c759';
        });

        ros.on('error', () => {
            statusEl.innerText = 'STATUS: WAITING...';
            statusEl.style.color = '#888';
            setTimeout(connectROS, 4000);
        });

        ros.on('close', () => {
            statusEl.innerText = 'STATUS: OFFLINE';
            setTimeout(connectROS, 4000);
        });

        var pulseListener = new ROSLIB.Topic({
            ros : ros,
            name : '/heart_rate',
            messageType : 'std_msgs/Float32'
        });

        pulseListener.subscribe((message) => {
            const bpm = Math.round(message.data);
            bpmEl.innerText = bpm;

            heartEl.style.transform = "scale(1.3)";
            setTimeout(() => {
                heartEl.style.transform = "scale(1.0)";
            }, 100);
        });

        function controlSystem(action) {
            statusEl.innerText = 'COMMAND: ' + action.toUpperCase() + '...';
            
            fetch('/' + action)
                .then(res => res.json())
                .then(data => {
                    console.log(action);
                    statusEl.innerText = 'SERVER: ' + data.status;
                    if(action === 'stop') {
                        bpmEl.innerText = '--';
                    }
                })
                .catch(err => {
                    statusEl.innerText = 'ERROR: NO CONNECTION TO BACKEND';
                    console.error(err);
                });
        }

        connectROS();

    </script>
</body>
</html>
