<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Mirror Kiosk</title>
    <script src="/vendor/roslib/roslib.min.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #050608;
            --text: #f8fafc;
            --muted: #9aa4b2;
            --line: rgba(255, 255, 255, 0.12);
            --pulse: #ff3b30;
            --mood: #4fc3f7;
            --ok: #31d158;
            --warn: #ffd60a;
            --bad: #ff453a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
        }

        main {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            padding: clamp(24px, 5vw, 72px);
        }

        header,
        footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            font-size: clamp(18px, 2vw, 28px);
            font-weight: 700;
            letter-spacing: 0;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: clamp(14px, 1.4vw, 18px);
            white-space: nowrap;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--warn);
            box-shadow: 0 0 18px currentColor;
        }

        .dot.connected {
            background: var(--ok);
        }

        .dot.offline {
            background: var(--bad);
        }

        .dashboard {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: center;
            gap: clamp(32px, 7vw, 120px);
            width: min(1500px, 100%);
            margin: 0 auto;
        }

        .metric {
            min-width: 0;
            text-align: center;
        }

        .symbol {
            height: clamp(120px, 18vw, 230px);
            display: grid;
            place-items: center;
            font-size: clamp(90px, 14vw, 190px);
            line-height: 1;
            transition: transform 160ms ease, filter 160ms ease;
        }

        #heart {
            color: var(--pulse);
            text-shadow: 0 0 42px rgba(255, 59, 48, 0.32);
        }

        #mood-emoji {
            text-shadow: 0 0 42px rgba(79, 195, 247, 0.22);
        }

        .value {
            display: block;
            margin-top: 18px;
            font-size: clamp(78px, 13vw, 180px);
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: 0;
            overflow-wrap: anywhere;
        }

        .label {
            display: block;
            margin-top: 18px;
            color: var(--muted);
            font-size: clamp(18px, 2.3vw, 34px);
            font-weight: 600;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        #mood-text {
            text-transform: capitalize;
            color: var(--mood);
            font-size: clamp(58px, 9vw, 128px);
        }

        .details {
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: clamp(12px, 1.3vw, 16px);
            min-height: 24px;
        }

        .pulse {
            transform: scale(1.15);
            filter: brightness(1.18);
        }

        @media (max-width: 800px) {
            main {
                padding: 22px;
            }

            header,
            footer {
                align-items: flex-start;
                flex-direction: column;
            }

            .dashboard {
                grid-template-columns: 1fr;
                gap: 36px;
                align-content: center;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div class="brand">Smart Mirror</div>
            <div class="status">
                <span id="status-dot" class="dot"></span>
                <span id="connection-status">ROS wird verbunden</span>
            </div>
        </header>

        <section class="dashboard" aria-live="polite">
            <div class="metric">
                <div id="heart" class="symbol">❤</div>
                <span id="bpm-value" class="value">--</span>
                <span class="label">BPM</span>
            </div>

            <div class="metric">
                <div id="mood-emoji" class="symbol">🤖</div>
                <span id="mood-text" class="value">--</span>
                <span class="label">Mood</span>
            </div>
        </section>

        <footer>
            <div id="system-status" class="details">Node startet ROS-Stack...</div>
            <div id="last-update" class="details">Noch keine Messdaten</div>
        </footer>
    </main>

    <script>
        const connectionStatusEl = document.getElementById('connection-status');
        const systemStatusEl = document.getElementById('system-status');
        const lastUpdateEl = document.getElementById('last-update');
        const statusDotEl = document.getElementById('status-dot');
        const bpmEl = document.getElementById('bpm-value');
        const heartEl = document.getElementById('heart');
        const moodEmojiEl = document.getElementById('mood-emoji');
        const moodTextEl = document.getElementById('mood-text');

        let ros;
        let reconnectTimer;

        function setConnectionState(text, state) {
            connectionStatusEl.innerText = text;
            statusDotEl.classList.remove('connected', 'offline');
            if (state) {
                statusDotEl.classList.add(state);
            }
        }

        function animate(el) {
            el.classList.add('pulse');
            setTimeout(() => el.classList.remove('pulse'), 180);
        }

        function formatClock() {
            return new Date().toLocaleTimeString('de-DE', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function updateLastData(label) {
            lastUpdateEl.innerText = `${label}: ${formatClock()}`;
        }

        function moodToEmoji(mood) {
            const normalized = mood.toLowerCase();
            if (normalized.includes('smiling') || normalized.includes('happy') || normalized.includes('joy')) return '😊';
            if (normalized.includes('sad')) return '😢';
            if (normalized.includes('angry') || normalized.includes('mad')) return '😠';
            if (normalized.includes('surprise')) return '😲';
            if (normalized.includes('neutral')) return '😐';
            if (normalized.includes('fear') || normalized.includes('scared')) return '😨';
            if (normalized.includes('disgust')) return '🤢';
            return '🤖';
        }

        function subscribeTopics() {
            const pulseListener = new ROSLIB.Topic({
                ros,
                name: '/heart_rate',
                messageType: 'std_msgs/Float32'
            });

            pulseListener.subscribe((message) => {
                const bpm = Math.round(Number(message.data));
                bpmEl.innerText = Number.isFinite(bpm) ? bpm : '--';
                animate(heartEl);
                updateLastData('Puls');
            });

            const moodListener = new ROSLIB.Topic({
                ros,
                name: '/mood',
                messageType: 'std_msgs/String'
            });

            moodListener.subscribe((message) => {
                const mood = String(message.data || '--');
                moodEmojiEl.innerText = moodToEmoji(mood);
                moodTextEl.innerText = mood;
                animate(moodEmojiEl);
                updateLastData('Mood');
            });
        }

        function connectROS() {
            clearTimeout(reconnectTimer);
            ros = new ROSLIB.Ros();
            const rosUrl = `ws://${window.location.hostname}:9090`;

            ros.on('connection', () => {
                setConnectionState('ROS verbunden', 'connected');
                subscribeTopics();
            });

            ros.on('error', () => {
                setConnectionState('Warte auf Rosbridge', 'offline');
                reconnectTimer = setTimeout(connectROS, 3000);
            });

            ros.on('close', () => {
                setConnectionState('ROS offline', 'offline');
                reconnectTimer = setTimeout(connectROS, 3000);
            });

            ros.connect(rosUrl);
        }

        async function refreshSystemStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                systemStatusEl.innerText = status.rosStackRunning
                    ? `ROS-Stack aktiv seit ${status.rosStackStartedAt || '-'}`
                    : `ROS-Stack nicht aktiv: ${(status.rosStackExit && status.rosStackExit.message) || 'wartet'}`;
            } catch (error) {
                systemStatusEl.innerText = 'Node-Backend nicht erreichbar';
            }
        }

        window.addEventListener('keydown', async (event) => {
            if (event.key.toLowerCase() === 'r') {
                await fetch('/api/start', { method: 'POST' });
                refreshSystemStatus();
            }
        });

        if (!window.ROSLIB) {
            systemStatusEl.innerText = 'roslib fehlt. Bitte npm install im kiosk-webui Ordner ausfuehren.';
        } else {
            connectROS();
        }

        refreshSystemStatus();
        setInterval(refreshSystemStatus, 5000);
    </script>
</body>
</html>
