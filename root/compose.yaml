services:
  smartmirror:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartmirror-kiosk-noetic:local
    container_name: smartmirror-kiosk
    network_mode: host
    privileged: true
    environment:
      PORT: "3001"
      OPEN_BROWSER: "0"
      KIOSK: "0"
      CAMERA_MODE: ${CAMERA_MODE:-webcam}
      ROS_MASTER_URI: http://127.0.0.1:11311
      ROS_IP: 127.0.0.1
      PYLON_ROOT: /opt/pylon
      LD_LIBRARY_PATH: /opt/pylon/lib
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    restart: unless-stopped
